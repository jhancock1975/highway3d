name: imagegen

# Builds the vast.ai image in imagegen/, pushes it to GHCR, boots it on the runner's CPU
# to check every service, and only then moves :latest to it.
on:
  push:
    paths:
      - "imagegen/**"
      - ".github/workflows/imagegen.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagegen-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/imagegen-vast

defaults:
  run:
    # explicit bash means -eo pipefail, so a failing command piped into tee still fails
    shell: bash

jobs:
  model-urls:
    name: Model URLs download without a token
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: HEAD-check every model URL in the provisioning manifests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyyaml
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/venv/bin/python" imagegen/ci/check-model-urls.py imagegen/ROOT/opt/imagegen/provisioning \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build, push and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space (the base image is ~10 GB compressed, ~30 GB unpacked)
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell \
            /usr/share/swift /opt/az /usr/local/lib/node_modules /usr/local/share/chromium \
            /opt/microsoft /opt/google
          docker system prune --all --force --volumes
          sudo apt-get clean
          # Put Docker's storage on whichever disk now has more room.
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          mnt_free=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            [ -f /etc/docker/daemon.json ] || echo '{}' | sudo tee /etc/docker/daemon.json >/dev/null
            sudo jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json.new >/dev/null
            sudo mv /etc/docker/daemon.json.new /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          docker info --format 'Docker root: {{.DockerRootDir}}'
          df -h / /mnt || true

      - name: Tags
        id: tags
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        id: buildx

      # BuildKit pushes the base image's layers byte-for-byte, so they keep vast's
      # digests and hosts that already hold vastai/comfy skip them.
      - name: Build and push ${{ env.IMAGE }}:${{ steps.tags.outputs.short_sha }}
        run: |
          docker buildx build imagegen \
            --platform linux/amd64 \
            --build-arg SOURCE_URL="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.created="${{ steps.tags.outputs.created }}" \
            --cache-from type=registry,ref="$IMAGE:latest" \
            --cache-to type=inline \
            --provenance=false \
            --tag "$IMAGE:${{ steps.tags.outputs.short_sha }}" \
            --push

      - name: Check the base layers kept vast's digests
        run: |
          base=$(grep -m1 '^ARG BASE_IMAGE=' imagegen/Dockerfile | cut -d= -f2)
          python3 imagegen/ci/compare-layers.py "$base" "$IMAGE:${{ steps.tags.outputs.short_sha }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Free the builder's cache before pulling the image back
        run: |
          docker buildx rm "${{ steps.buildx.outputs.name }}" || true
          docker system prune --all --force --volumes
          df -h / /mnt || true

      - name: Pull the pushed image
        run: docker pull "$IMAGE:${{ steps.tags.outputs.short_sha }}"

      - name: Smoke test (boot like vast, CPU only, no model downloads)
        run: bash imagegen/ci/smoke-test.sh "$IMAGE:${{ steps.tags.outputs.short_sha }}" smoke-out

      - name: Upload smoke-test output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-test-output
          path: |
            smoke-out/*.log
            smoke-out/*.json
            smoke-out/*.txt
            smoke-out/smoke.png
          if-no-files-found: ignore

      - name: Point :latest at the tested image
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ steps.tags.outputs.short_sha }}"
          {
            echo "Pushed and tested:"
            echo "- \`$IMAGE:${{ steps.tags.outputs.short_sha }}\`"
            echo "- \`$IMAGE:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

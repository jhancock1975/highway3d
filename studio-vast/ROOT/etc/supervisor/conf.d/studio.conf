# Logs go to stdout for vast's log viewer; logging.sh also tees them to /var/log/portal/<name>.log.

# The director's and ACE-Step's downloads, beside vast's provisioning (studio-fetch.py restarts a
# stalled one). Runs once; a download that gives up leaves .failed in its folder.
[program:studio-models]
command=/opt/supervisor-scripts/studio-models.sh
environment=PROC_NAME="%(program_name)s"
autostart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
autorestart=false
stopwaitsecs=30

# The chat. Exits 0 when "Studio Chat" is left out of PORTAL_CONFIG, and stays down then.

# The director LLM. Exits 0 when no model was downloaded (STUDIO_MODELS=none), and stays down then.
[program:vllm]
command=/opt/supervisor-scripts/vllm.sh
environment=PROC_NAME="%(program_name)s"
autostart=true
startsecs=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
autorestart=unexpected
exitcodes=0
stopwaitsecs=60


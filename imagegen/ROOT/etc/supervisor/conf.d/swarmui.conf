[program:swarmui]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/swarmui.sh
autostart=true
# Restart after a crash, but not after a clean exit: the script exits 0 on purpose when
# SwarmUI is left out of PORTAL_CONFIG, and SwarmUI's own restart button is handled
# inside launch-linux.sh.
autorestart=unexpected
exitcodes=0
startsecs=0
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=20
# Logs must go to stdout for vast's log viewer; logging.sh also tees them into
# /var/log/portal/swarmui.log for the Instance Portal.
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0
